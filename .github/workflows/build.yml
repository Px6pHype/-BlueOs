name: Build LineageOS Duchamp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 20480
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize and Sync LineageOS Source
        run: |
          mkdir -p ~/lineage && cd ~/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j8

      - name: Inject Custom Device Tree
        run: |
          mkdir -p ~/lineage/device/xiaomi/duchamp
          cp -r $GITHUB_WORKSPACE/* ~/lineage/device/xiaomi/duchamp/

      - name: Start Compilation
        run: |
          cd ~/lineage
          source build/envsetup.sh
          breakfast lineage_duchamp userdebug
          mka bacon -j8
